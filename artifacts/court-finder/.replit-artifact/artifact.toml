kind = "web"
previewPath = "/"
title = "Toronto Court Finder"
version = "1.0.0"
id = "artifacts/court-finder"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24467

[services.development]
run = "pnpm --filter @workspace/court-finder run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/court-finder", "run", "build" ]
publicDir = "artifacts/court-finder/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24467"
BASE_PATH = "/"
