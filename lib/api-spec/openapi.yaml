openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Toronto Court Finder API (read-only)
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: courts
    description: Basketball court operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /courts:
    get:
      operationId: listCourts
      tags: [courts]
      summary: List all basketball courts
      description: Returns all basketball courts in Toronto
      responses:
        "200":
          description: List of courts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Court"

  /courts/summary:
    get:
      operationId: getCourtsSummary
      tags: [courts]
      summary: Get courts summary stats
      description: Returns aggregate counts across all courts
      responses:
        "200":
          description: Summary stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourtsSummary"

  /courts/{id}:
    get:
      operationId: getCourt
      tags: [courts]
      summary: Get a single court
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Court details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Court"
        "404":
          description: Court not found

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Court:
      type: object
      required:
        - id
        - name
        - address
        - neighborhood
        - lat
        - lng
        - courtType
      properties:
        id:
          type: integer
        name:
          type: string
        address:
          type: string
        neighborhood:
          type: string
        lat:
          type: number
        lng:
          type: number
        courtType:
          type: string
          description: "park, community, or school"

    CourtsSummary:
      type: object
      required:
        - totalCourts
        - parkCourts
        - schoolCourts
        - communityCourts
      properties:
        totalCourts:
          type: integer
        parkCourts:
          type: integer
        schoolCourts:
          type: integer
        communityCourts:
          type: integer
